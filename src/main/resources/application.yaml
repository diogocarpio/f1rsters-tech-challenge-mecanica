spring:
  application:
    name: tech-challenge-mecanica
  datasource:
    url: jdbc:postgresql://localhost:5432/oficina
    username: oficinauser
    password: oficinapassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    generate-ddl: true

# Para acessar o Swagger na mesma porta:
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENV:local}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  newrelic:
    metrics:
      export:
        enabled: true
        meter-name-event-type-enabled: true
        account-id: ${NEW_RELIC_ACCOUNT_ID:0}
        api-key: ${NEW_RELIC_API_KEY:}
        step: 10s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

security:
  jwt:
    # Chave Base64 com no minimo 256 bits; em producao use somente variavel de ambiente.
    secret: ${JWT_SECRET_BASE64:QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVo0NTY3ODkwQUJDREVG}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    issuer: ${JWT_ISSUER:tech-challenge-mecanica-api}
  seed:
    enabled: ${SECURITY_SEED_ENABLED:true}
    admin:
      email: ${SECURITY_SEED_ADMIN_EMAIL:admin@oficina.local}
      password: ${SECURITY_SEED_ADMIN_PASSWORD:admin123}
