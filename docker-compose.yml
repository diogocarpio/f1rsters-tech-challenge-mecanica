services:
  db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_DB=oficina
      - POSTGRES_USER=oficinauser
      - POSTGRES_PASSWORD=oficinapassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficinauser"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: oficina-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/oficina
      - SPRING_DATASOURCE_USERNAME=oficinauser
      - SPRING_DATASOURCE_PASSWORD=oficinapassword
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET_BASE64=QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVo0NTY3ODkwQUJDREVG
      - JWT_ACCESS_TOKEN_MINUTES=15
      - JWT_ISSUER=tech-challenge-mecanica-api
      - SECURITY_SEED_ENABLED=true
      - SECURITY_SEED_ADMIN_EMAIL=admin@oficina.local
      - SECURITY_SEED_ADMIN_PASSWORD=admin123
      - NEW_RELIC_ENABLED=${NEW_RELIC_ENABLED:-true}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-tech-challenge-mecanica-local}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-}
      - NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=${NEW_RELIC_DISTRIBUTED_TRACING_ENABLED:-true}
      - NEW_RELIC_ACCOUNT_ID=${NEW_RELIC_ACCOUNT_ID:-0}
      - NEW_RELIC_API_KEY=${NEW_RELIC_API_KEY:-}
      - NEW_RELIC_ENVIRONMENT=docker-local
      - APP_ENV=docker-local

volumes:
  postgres-data: