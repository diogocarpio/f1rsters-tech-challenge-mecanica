name: CI/CD - Tech Challenge Mecânica

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  K8S_NAMESPACE: oficina
  APP_DEPLOYMENT: oficina-app
  DB_DEPLOYMENT: postgres-db
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build_and_test:
    name: Build e testes automatizados
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Garantir permissao do Maven Wrapper
        run: chmod +x mvnw

      - name: Executar build e testes (inclui JaCoCo)
        run: ./mvnw -B clean verify

  docker_build_and_push:
    name: Build da imagem Docker
    needs: build_and_test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_uri: ${{ steps.image_meta.outputs.image_uri }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir metadados da imagem
        id: image_meta
        shell: bash
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          IMAGE_LATEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image_meta.outputs.image_uri }}
            ${{ steps.image_meta.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy em DEV (requere aprovação de ambiente)
    needs: docker_build_and_push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configurar kubeconfig
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBE_CONFIG_DATA}" | base64 --decode > "$HOME/.kube/config"
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Aplicar overlay kustomize (dev)
        shell: bash
        run: |
          kubectl apply -k k8s/overlays/dev

      - name: Atualizar imagem para a tag do build
        shell: bash
        run: |
          kubectl -n ${K8S_NAMESPACE} set image deployment/${APP_DEPLOYMENT} oficina-app=${{ needs.docker_build_and_push.outputs.image_uri }}

  deploy-qa:
    name: Deploy em QA (requer aprovação de ambiente)
    needs: deploy-dev
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configurar kubeconfig
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBE_CONFIG_DATA}" | base64 --decode > "$HOME/.kube/config"
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Aplicar overlay kustomize (qa)
        shell: bash
        run: |
          kubectl apply -k k8s/overlays/qa

      - name: Atualizar imagem para a tag do build
        shell: bash
        run: |
          kubectl -n ${K8S_NAMESPACE} set image deployment/${APP_DEPLOYMENT} oficina-app=${{ needs.docker_build_and_push.outputs.image_uri }}

  deploy-prod:
    name: Deploy em PROD (requer aprovação de ambiente)
    needs: deploy-qa
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configurar kubeconfig
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBE_CONFIG_DATA}" | base64 --decode > "$HOME/.kube/config"
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Aplicar overlay kustomize (prod)
        shell: bash
        run: |
          kubectl apply -k k8s/overlays/prod

      - name: Atualizar imagem para a tag do build
        shell: bash
        run: |
          kubectl -n ${K8S_NAMESPACE} set image deployment/${APP_DEPLOYMENT} oficina-app=${{ needs.docker_build_and_push.outputs.image_uri }}
