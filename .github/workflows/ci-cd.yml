name: CI/CD - Tech Challenge Mecânica

on:
  push:
    branches:
      - main
      - homologacao
      - develop
      - feature/diogo
      - feature/alexandra
      - feature/rodrigo
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  K8S_NAMESPACE: oficina
  APP_DEPLOYMENT: oficina-app
  DB_DEPLOYMENT: postgres-db
  IMAGE_NAME: f1rsters-tech-challenge-mecanica-app
  IMAGE_TAG: latest
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_test:
    name: Build e testes automatizados
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v5

      - name: Configurar Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Garantir permissao do Maven Wrapper (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x mvnw

      - name: Executar build e testes (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./mvnw -B clean verify

      - name: Executar build e testes (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B clean verify

  build_and_deploy_k8s:
    name: Build e deploy no Kubernetes
    needs: build_and_test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homologacao' || github.ref == 'refs/heads/develop'
    runs-on: self-hosted

    permissions:
      contents: read

    env:
      IMAGE_NAME: f1rsters-tech-challenge-mecanica-app
      IMAGE_TAG: latest
      K8S_NAMESPACE: oficina
      APP_DEPLOYMENT: oficina-app
      APP_CONTAINER: oficina-app

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: latest

      - name: Validar ferramentas e cluster (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          docker version
          kubectl version --client
          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes

      - name: Validar ferramentas e cluster (Windows)
        if: runner.os == 'Windows'
        run: |
          docker version
          kubectl version --client
          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes

      - name: Build da imagem Docker local (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          docker build --pull -t "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" .

      - name: Build da imagem Docker local (Windows)
        if: runner.os == 'Windows'
        run: |
          docker build --pull -t "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" .

      - name: Validar imagem criada (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          docker image inspect "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      - name: Validar imagem criada (Windows)
        if: runner.os == 'Windows'
        run: |
          docker image inspect "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      - name: Aplicar namespace (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Aplicar namespace (Windows)
        if: runner.os == 'Windows'
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Aplicar manifestos do banco de dados (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          kubectl apply -f k8s/db-secret.yaml
          kubectl apply -f k8s/db-pvc.yaml
          kubectl apply -f k8s/db-service.yaml
          kubectl apply -f k8s/db-deployment.yaml

      - name: Aplicar manifestos do banco de dados (Windows)
        if: runner.os == 'Windows'
        run: |
          kubectl apply -f k8s/db-secret.yaml
          kubectl apply -f k8s/db-pvc.yaml
          kubectl apply -f k8s/db-service.yaml
          kubectl apply -f k8s/db-deployment.yaml

      - name: Aguardar banco de dados (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          kubectl rollout status deployment/postgres-db \
            --namespace "${{ env.K8S_NAMESPACE }}" \
            --timeout=180s

      - name: Aguardar banco de dados (Windows)
        if: runner.os == 'Windows'
        run: |
          kubectl rollout status deployment/postgres-db --namespace "${{ env.K8S_NAMESPACE }}" --timeout=180s

      - name: Aplicar manifestos da aplicação (Linux/macOS)
        shell: bash
        if: runner.os != 'Windows'
        run: |
          kubectl apply -f k8s/app-secret.yaml
          kubectl apply -f k8s/app-configmap.yaml
          kubectl apply -f k8s/app-service.yaml
          kubectl apply -f k8s/app-deployment.yaml
          kubectl apply -f k8s/app-hpa.yaml

      - name: Aplicar manifestos da aplicação (Windows)
        if: runner.os == 'Windows'
        run: |
          kubectl apply -f k8s/app-secret.yaml
          kubectl apply -f k8s/app-configmap.yaml
          kubectl apply -f k8s/app-service.yaml
          kubectl apply -f k8s/app-deployment.yaml
          kubectl apply -f k8s/app-hpa.yaml

      - name: Atualizar imagem da aplicação (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          kubectl set image \
            deployment/${{ env.APP_DEPLOYMENT }} \
            ${{ env.APP_CONTAINER }}=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --namespace "${{ env.K8S_NAMESPACE }}"

      - name: Atualizar imagem da aplicação (Windows)
        if: runner.os == 'Windows'
        run: |
          kubectl set image deployment/${{ env.APP_DEPLOYMENT }} ${{ env.APP_CONTAINER }}=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --namespace "${{ env.K8S_NAMESPACE }}"

      - name: Aguardar rollout da aplicação (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          kubectl rollout status \
            deployment/${{ env.APP_DEPLOYMENT }} \
            --namespace "${{ env.K8S_NAMESPACE }}" \
            --timeout=300s

      - name: Aguardar rollout da aplicação (Windows)
        if: runner.os == 'Windows'
        run: |
          kubectl rollout status deployment/${{ env.APP_DEPLOYMENT }} --namespace "${{ env.K8S_NAMESPACE }}" --timeout=300s

      - name: Exibir recursos implantados (Linux/macOS)
        if: always() && runner.os != 'Windows'
        run: |
          kubectl get pods \
            --namespace "${{ env.K8S_NAMESPACE }}" \
            -o wide

          kubectl get services \
            --namespace "${{ env.K8S_NAMESPACE }}"

          kubectl get deployments \
            --namespace "${{ env.K8S_NAMESPACE }}"

      - name: Exibir recursos implantados (Windows)
        if: always() && runner.os == 'Windows'
        run: |
          kubectl get pods --namespace "${{ env.K8S_NAMESPACE }}" -o wide
          kubectl get services --namespace "${{ env.K8S_NAMESPACE }}"
          kubectl get deployments --namespace "${{ env.K8S_NAMESPACE }}"