name: CI/CD - AWS Tech Challenge

on:
  push:
    branches:
      - main
      - homologacao
      - develop
      - feature/diogo
      - feature/alexandra
      - feature/rodrigo
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: aws-ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  AWS_REGION: "sa-east-1"
  PROJECT_NAME: "f1rsters-tech-challenge-mecanica"
  LAMBDA_FUNCTION_NAME: "f1rsters-tech-challenge-auth-function"
  LAMBDA_ARTIFACTS_BUCKET: "f1rsters-tech-challenge-lambda-artifacts"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_test_lambda:
    name: Build e testes Lambda Function
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build Lambda Function
        run: |
          cd aws/lambda/auth-function
          mvn clean package

      - name: Executar testes Lambda
        run: |
          cd aws/lambda/auth-function
          mvn test

      - name: Upload Lambda JAR
        uses: actions/upload-artifact@v4
        with:
          name: lambda-jar
          path: aws/lambda/auth-function/target/auth-function.jar
          retention-days: 7

  deploy_lambda:
    name: Deploy Lambda Function
    needs: build_and_test_lambda
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homologacao' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Download Lambda JAR
        uses: actions/download-artifact@v4
        with:
          name: lambda-jar
          path: aws/lambda/auth-function/target

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 cp aws/lambda/auth-function/target/auth-function.jar \
            s3://${{ env.LAMBDA_ARTIFACTS_BUCKET }}/auth-function.jar

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --s3-bucket ${{ env.LAMBDA_ARTIFACTS_BUCKET }} \
            --s3-key auth-function.jar

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }}

  terraform_plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          cd aws/terraform
          terraform init \
            -backend-config="bucket=f1rsters-tech-challenge-terraform-state" \
            -backend-config="key=tech-challenge-mecanica/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Force Unlock Terraform State
        continue-on-error: true
        run: |
          cd aws/terraform
          terraform force-unlock -force d49a3c19-c508-bebd-7088-f654c574c61f || true

      - name: Terraform Format Check
        run: |
          cd aws/terraform
          terraform fmt

      - name: Terraform Validate
        run: |
          cd aws/terraform
          terraform validate

      - name: Terraform Plan
        run: |
          cd aws/terraform
          terraform plan -out=tfplan

      - name: Terraform Plan Summary
        id: plan
        run: |
          cd aws/terraform
          terraform show -no-color tfplan

      - name: Comment PR with Terraform Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  terraform_apply:
    name: Terraform Apply
    needs: terraform_plan
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homologacao'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'homologation' }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          cd aws/terraform
          terraform init \
            -backend-config="bucket=f1rsters-tech-challenge-terraform-state" \
            -backend-config="key=tech-challenge-mecanica/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Force Unlock Terraform State
        continue-on-error: true
        run: |
          cd aws/terraform
          terraform force-unlock -force d49a3c19-c508-bebd-7088-f654c574c61f || true

      - name: Terraform Apply
        run: |
          cd aws/terraform
          terraform apply -auto-approve

      - name: Terraform Outputs
        run: |
          cd aws/terraform
          terraform output -json
